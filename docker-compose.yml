version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aleamaris-trng-api:latest
    environment:
      # Vídeo grabado sin acreditar (NO es entropía real): /trng/bytes da 503.
      # TRNG de verdad: ALEAMARIS_USE_CAM=1 y devices: ["/dev/video0:/dev/video0"]
      # Demo del pipeline (salida reproducible): ALEAMARIS_CREDIT_FILE_SOURCE=1
      - ALEAMARIS_VIDEO=/app/sample.MP4
      - ALEAMARIS_CREDIT_FILE_SOURCE=${ALEAMARIS_CREDIT_FILE_SOURCE:-0}
      # El DRBG puede tirar de os.urandom cuando el vídeo se agota
      - ALEAMARIS_ALLOW_URANDOM=1
      # Sin key, /trng/ingest y /rng/reseed quedan deshabilitados (403)
      - ALEAMARIS_API_KEY=${ALEAMARIS_API_KEY:-}
      # Logging estilo log4j en texto y persistencia a volumen
      - ALEAMARIS_LOG_LEVEL=INFO
      - ALEAMARIS_LOG_JSON=0
      - ALEAMARIS_LOG_FILE=/app/logs/aleamaris.log
    ports:
      - "50000:8080"
    volumes:
      - logs:/app/logs
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: aleamaris-trng-web:latest
    ports:
      - "50001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  logs:
    driver: local
